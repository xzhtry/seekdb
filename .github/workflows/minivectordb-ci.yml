name: MiniVectorDB Docker Smoke

on:
  push:
    branches:
      - 2026-competition-round2
  workflow_dispatch:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --progress=plain -t minivectordb:ci .

      # The official checker speaks exactly the protocol the judge speaks, so
      # running it against the built image is the closest local approximation
      # of the real evaluation.
      - name: Protocol handshake against the image
        run: |
          set -euo pipefail
          cd protocol_check
          python3 run.py --image minivectordb:ci --handshake-only \
            --output "protocol-results/handshake-${{ github.run_id }}"

      - name: Public cases against the image
        run: |
          set -euo pipefail
          cd protocol_check
          python3 run.py --image minivectordb:ci \
            --output "protocol-results/public-${{ github.run_id }}"

      # The judge runs the image with --memory=2g --cpus=2 --read-only and a
      # 120s startup / 60s request budget.  These scenarios reproduce the
      # requirements the public pack only mentions in prose (data volume beyond
      # the memory budget, forced kill, a second kill during recovery, illegal
      # vectors, ANN mode) against the real image under those limits.
      - name: Formal simulation against the image
        run: |
          set -euo pipefail
          python3 tests/formal_sim.py --image minivectordb:ci \
            --workdir /tmp/formal-sim --rows 20000

      - name: Robustness sweep against the image
        run: |
          set -euo pipefail
          python3 tests/robustness.py --image minivectordb:ci \
            --workdir /tmp/robustness | tail -25

      - name: SQL fuzz against the image
        run: |
          set -euo pipefail
          python3 tests/fuzz_sql.py --image minivectordb:ci \
            --workdir /tmp/fuzz --iterations 2000 | tail -10

      # The judge fails a case with "JSON response timeout" when one statement
      # misses its 60s budget, so the latency of the worst single statement is
      # measured inside the container as well.
      - name: Single request latency against the image
        run: |
          set -euo pipefail
          python3 tests/stress_single_request.py --image minivectordb:ci \
            --workdir /tmp/stress --rows 100000 --one-shot-rows 20000

      # Harder variants of the 20 public cases, checked against a brute force
      # oracle in Python.  The formal pack is the same cases made harder, so
      # this is the closest local approximation of the sealed suite.
      - name: Hardened public cases against the image
        run: |
          set -euo pipefail
          python3 tests/hardened_cases.py --image minivectordb:ci \
            --workdir /tmp/hardened

      # Request field variants and malformed requests: every one of them has
      # to be answered, and the answer has to carry the request id.
      - name: Protocol edge cases against the image
        run: |
          set -euo pipefail
          python3 tests/probe_protocol_edges.py --image minivectordb:ci \
            --workdir /tmp/proto
          python3 tests/probe_malformed.py --image minivectordb:ci \
            --workdir /tmp/proto2
