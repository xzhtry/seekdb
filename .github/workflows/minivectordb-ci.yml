name: MiniVectorDB Docker Smoke

on:
  push:
    branches:
      - 2026-competition-round2
  workflow_dispatch:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --progress=plain -t minivectordb:ci .

      # The official checker speaks exactly the protocol the judge speaks, so
      # running it against the built image is the closest local approximation
      # of the real evaluation.
      - name: Protocol handshake against the image
        run: |
          set -euo pipefail
          cd protocol_check
          python3 run.py --image minivectordb:ci --handshake-only \
            --output "protocol-results/handshake-${{ github.run_id }}"

      - name: Public cases against the image
        run: |
          set -euo pipefail
          cd protocol_check
          python3 run.py --image minivectordb:ci \
            --output "protocol-results/public-${{ github.run_id }}"
